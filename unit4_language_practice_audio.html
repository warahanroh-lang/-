<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 4: Language Practice – Audio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fffdf5;--fg:#1d2b53;--card:#fff;--bd:#e6dfc8;--ac:#2f6fed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181f;--fg:#eef1f8;--card:#20242e;--bd:#333a48;--ac:#6ea0ff}}
:root[data-theme="dark"]{--bg:#15181f;--fg:#eef1f8;--card:#20242e;--bd:#333a48;--ac:#6ea0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
h1{font-size:1.3rem;text-align:center}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px auto;max-width:480px}
.l{font-weight:700;width:1.5em}
.t{flex:1;font-size:1.1rem}
.t small{display:block;opacity:.7;font-size:.8rem}
button{border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:1rem;padding:10px 14px}
.bar{display:flex;gap:10px;max-width:480px;margin:10px auto}.bar button{flex:1}#msg{text-align:center;font-size:.9rem;min-height:1.2em}
h2{font-size:1rem;max-width:480px;margin:18px auto 0;opacity:.8}
.all{display:block;margin:14px auto;max-width:480px;width:100%}
</style>
</head>
<body>
<h1>🔊 Language Practice — tap to listen</h1>
<div class="bar"><button id="copy">📋 Copy link</button><button id="share">📤 Share</button></div><div id="msg"></div>
<div id="list"></div>
<button class="all" id="all">▶ Play all</button>
<script>
var secs=[
["3. Complete the rules",[["Use the examples above to complete the rules.","Use the examples above to complete the rules."],["1. a few and many can only be used before countable nouns.","One. A few and many can only be used before countable nouns."],["2. a little and much can only be used before uncountable nouns.","Two. A little and much can only be used before uncountable nouns."],["3. a lot of can be used before both countable and uncountable nouns.","Three. A lot of can be used before both countable and uncountable nouns."]]],
["Countable",[["apples, books, vegetables, chocolate bars","apples, books, vegetables, chocolate bars"]]],
["Uncountable",[["water, milk, homework, fruit juice","water, milk, homework, fruit juice"]]],
["4. Complete the sentences",[["Complete the sentences.","Complete the sentences."],["a. I want a lot of vegetables, please. I love them!","A. I want a lot of vegetables, please. I love them!"],["b. I've got too many books in my bag, and I can't carry it.","B. I've got too many books in my bag, and I can't carry it."],["c. I've got too much homework. I'll never finish!","C. I've got too much homework. I'll never finish!"],["d. You can't eat all those chocolate bars! That's too many!","D. You can't eat all those chocolate bars! That's too many!"],["e. If you need help, I speak a little French.","E. If you need help, I speak a little French."],["f. I ate a few crisps today and a lot of fruit and vegetables. I ate healthy food today!","F. I ate a few crisps today and a lot of fruit and vegetables. I ate healthy food today!"]]]
];
function pick(){try{return speechSynthesis.getVoices().filter(function(x){return x.lang.replace("_","-")==="en-GB"})[0]}catch(e){}}
function say(t,cb){try{speechSynthesis.cancel();var parts=t.match(/[^.?!]+[.?!]*/g)||[t];var i=0;(function next(){if(i>=parts.length){if(cb)cb();return}var u=new SpeechSynthesisUtterance(parts[i++].trim());u.lang="en-GB";u.rate=.7;var v=pick();if(v)u.voice=v;u.onend=next;speechSynthesis.speak(u)})();}catch(e){}}
var list=document.getElementById("list"),flat=[];
secs.forEach(function(sc){var h=document.createElement("h2");h.textContent=sc[0];list.appendChild(h);sc[1].forEach(function(it){flat.push(it[1]);var d=document.createElement("div");d.className="row";var t=document.createElement("span");t.className="t";t.textContent=it[0];d.appendChild(t);var b=document.createElement("button");b.textContent="\uD83D\uDD0A";b.onclick=function(){say(it[1])};d.appendChild(b);list.appendChild(d);});});
document.getElementById("all").onclick=function(){var i=0;(function next(){if(i<flat.length){say(flat[i++],next);}})();};
var LINK="https://warahanroh-lang.github.io/-/unit4_language_practice_audio.html",msg=document.getElementById("msg");
function note(t){msg.textContent=t;setTimeout(function(){msg.textContent=""},2500)}
function fallbackCopy(){var a=document.createElement("textarea");a.value=LINK;document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(a);note(ok?"Link copied ✓":LINK)}
document.getElementById("copy").onclick=function(){try{navigator.clipboard.writeText(LINK).then(function(){note("Link copied ✓")},fallbackCopy)}catch(e){fallbackCopy()}};
document.getElementById("share").onclick=function(){try{if(navigator.share){navigator.share({title:document.title,url:LINK}).catch(function(){})}else{fallbackCopy()}}catch(e){fallbackCopy()}};
</script>
</body>
</html>
