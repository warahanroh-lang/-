<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 1 – Lesson 2: A New Project | Match the Lines</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#000;background:linear-gradient(135deg,#ffd6e8,#d6ecff 40%,#d9ffe6 70%,#fff3c4);background-attachment:fixed;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:12px}
header,footer{text-align:center;background:rgba(255,255,255,.9);border-radius:20px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.12);color:#000}
h1{margin:0;font-size:21px}h2{margin:4px 0;font-size:15px;font-weight:600}
.by{display:inline-block;margin-top:6px;background:#ffe36e;border-radius:99px;padding:5px 18px;font-weight:700}
.hint{text-align:center;font-weight:600;margin:10px 0 4px;font-size:14px}
#board{position:relative;direction:ltr;margin-top:10px}
#svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
#cols{display:flex;align-items:stretch;justify-content:space-between}
#words{width:30%;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
#sents{width:58%}
.chip{border:3px solid;border-radius:14px;padding:11px 6px;font-size:16px;font-weight:800;text-align:center;background:#fff;color:#000;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 8px rgba(0,0,0,.15);position:relative;z-index:4}
.chip.sel{transform:scale(1.08);background:#fff6b8}
.chip.used{opacity:.55;pointer-events:none}
.card{background:#fff;color:#000;border-radius:16px;padding:10px 10px 10px 14px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.12);border:3px solid #cfcfe8;position:relative}
.card.ok{background:#e1ffe7}
.card.flash{background:#ffd9d9;border-color:#e03131!important;animation:blink .25s 5}
@keyframes blink{50%{background:#fff}}
.en{direction:ltr;text-align:left;font-size:16px;line-height:1.5;color:#000}
.num{font-weight:800;opacity:.55;margin-right:4px}
.pill{display:none;margin-top:4px;font-weight:800;color:#000}
.ok .pill{display:inline-block;background:#b6f5c3;border-radius:99px;padding:2px 12px}
.wn{display:none;margin-top:6px;direction:rtl;font-size:14px;line-height:1.7;color:#000;background:#ffe3e3;border-radius:10px;padding:6px 8px}
.fb{display:none;margin-top:6px;direction:rtl;text-align:right;font-size:14px;line-height:1.8;color:#000}
.done .fb{display:block}
.big{font-size:20px;font-weight:800}
.spk{border:0;background:#4c6fff;color:#fff;border-radius:50%;width:38px;height:38px;font-size:19px;cursor:pointer;vertical-align:middle}
path.ln{fill:none;stroke-width:5;stroke-linecap:round}
g.shake{animation:shk .1s linear infinite}
g.shake path.ln{stroke-dasharray:9 6;animation:col .2s linear infinite}
@keyframes shk{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-4px,-3px)}}
@keyframes col{0%{stroke:#ff0000}50%{stroke:#ff8c00}100%{stroke:#ff0000}}
#alarm{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:#e03131;color:#fff;font-weight:800;font-size:18px;padding:12px 22px;border-radius:0 0 16px 16px;z-index:200;transition:top .2s;box-shadow:0 6px 16px rgba(0,0,0,.35);white-space:nowrap}
#alarm.show{top:0;animation:blink2 .3s 4}
@keyframes blink2{50%{background:#ff8c00}}
#res{text-align:center;background:#fff;border-radius:18px;padding:16px;font-size:19px;font-weight:800;color:#000;margin-top:12px}
button.re{margin-top:8px;border:0;background:#22b04b;color:#fff;font-size:16px;font-weight:700;padding:10px 22px;border-radius:12px;cursor:pointer}
footer{margin-top:14px}
.conf{position:fixed;top:-30px;font-size:26px;z-index:99;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="alarm">⚠️ تنبيه! الوصلة خاطئة ⚠️</div>
<div class="wrap">
<header>
<h1>🔗 Unit 1 – Lesson 2: A New Project</h1>
<h2>لعبة واصل: صِل كل كلمة بالجملة المناسبة لها</h2>
<div class="by">✏️ إعداد الأستاذة: Dhuha Karim</div>
</header>
<p class="hint">اضغط على الكلمة ثم على الجملة، أو اسحب خطاً من الكلمة إلى الجملة 👇</p>
<p style="text-align:center;margin:4px 0"><button class="re" onclick="say('Hello! Welcome to Lesson Two, A New Project.')">🔊 تجربة الصوت</button></p>
<div id="board">
<svg id="svg"></svg>
<div id="cols"><div id="words"></div><div id="sents"></div></div>
</div>
<div id="res"></div>
<footer>🌟 مع تمنياتي لكم بالتوفيق<br><b>الأستاذة: Dhuha Karim</b></footer>
</div>
<script>
var D=[
{w:"article",s:"Article, noun.",d:"a piece of writing in a newspaper or magazine",t:"مقال",a:"مقال في صحيفة أو مجلة",r:"كلمة article اسم (n.) تعني مقال، وهي قطعة كتابة تُنشر في صحيفة أو مجلة."},
{w:"cover",s:"Cover, noun.",d:"the outside of a book or magazine",t:"غلاف",a:"غلاف كتاب أو مجلة",r:"كلمة cover اسم (n.) تعني الغلاف، أي الجزء الخارجي من الكتاب أو المجلة."},
{w:"edit",s:"Edit, verb.",d:"to check and correct a piece of writing",t:"يراجع ويصحح",a:"يراجع ويصحح الكتابة",r:"كلمة edit فعل (v.) يعني يراجع ويصحح، فهي تدل على عمل المراجعة والتصحيح."},
{w:"editor",s:"Editor, noun.",d:"somebody who edits",t:"محرر",a:"شخص يقوم بالتحرير",r:"كلمة editor اسم (n.) من الفعل edit، وتعني الشخص الذي يقوم بالتحرير."},
{w:"print",s:"Print, verb.",d:"to put words or pictures on paper with a machine",t:"يطبع",a:"يطبع كلمات أو صورًا على الورق",r:"كلمة print فعل (v.) يعني يطبع، أي ينقل الكلمات أو الصور على الورق بآلة."},
{w:"printer",s:"Printer, noun.",d:"1. somebody who prints as a job. 2. a machine that prints",t:"طابعة / شخص يطبع",a:"1. شخص يطبع (يعمل في الطباعة). 2. آلة الطباعة",r:"كلمة printer اسم (n.) من الفعل print، ولها معنيان: شخص يطبع كوظيفة، وآلة تطبع."},
{w:"report",s:"Report, verb.",d:"to describe an event",t:"يصف حدثًا",a:"يصف حدثًا",r:"كلمة report فعل (v.) يعني يصف حدثًا أو يخبر عنه."},
{w:"report",s:"Report, noun.",d:"a news report about an event",t:"تقرير",a:"تقرير إخباري عن حدث",r:"كلمة report اسم (n.) تعني تقرير، وهي مشتقة من الفعل report."},
{w:"reporter",s:"Reporter, noun.",d:"a person who reports",t:"مراسل",a:"شخص يكتب التقارير (مراسل)",r:"كلمة reporter اسم (n.) من الفعل report، وتعني الشخص الذي يعد التقارير (مراسل)."}
];
var COL=["#e6194b","#2e9e3f","#3a5bd9","#f58231","#911eb4","#008b8b","#c79a00","#e032c8","#7a5230"];
var NS="http://www.w3.org/2000/svg",sel=null,score=0,answered=0,R=[],FIRST=[],conn=[],voice=null,actx=null;
var board=document.getElementById("board"),svg=document.getElementById("svg");
function pick(){if(!window.speechSynthesis)return;var v=speechSynthesis.getVoices();voice=v.find(function(x){return x.lang.replace("_","-")==="en-GB"})||v.find(function(x){return /British|UK/i.test(x.name)})||v.find(function(x){return /^en/i.test(x.lang)})||null}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
function tts(t){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;pick();speechSynthesis.cancel();setTimeout(function(){var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u);speechSynthesis.resume()},120)}
function say(t){var d=false;function fb(){if(d)return;d=true;tts(t)}try{if(window.__a)window.__a.pause();if(window.speechSynthesis)speechSynthesis.cancel();var a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-GB&q="+encodeURIComponent(t));window.__a=a;a.playbackRate=.9;a.onerror=fb;var p=a.play();if(p&&p.catch)p.catch(fb)}catch(e){fb()}}
function full(i){var x=D[i];return x.s+" "+x.d.charAt(0).toUpperCase()+x.d.slice(1)+"."}
function alarm(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var t=actx.currentTime;for(var j=0;j<6;j++){var o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=j%2?620:920;g.gain.value=.16;o.connect(g);g.connect(actx.destination);o.start(t+j*.13);o.stop(t+j*.13+.11)}}catch(e){}
if(navigator.vibrate)navigator.vibrate([200,80,200,80,200]);
var a=document.getElementById("alarm");a.classList.remove("show");void a.offsetWidth;a.classList.add("show");setTimeout(function(){a.classList.remove("show")},1600)}
function confetti(){var e=["🎉","🎊","✨","⭐","🎈","🌸"];for(var i=0;i<30;i++){var s=document.createElement("span");s.className="conf";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()}.bind(null,s),3400)}}
function pt(el,side){var r=el.getBoundingClientRect(),b=board.getBoundingClientRect();return{x:(side=="r"?r.right:r.left)-b.left,y:r.top+r.height/2-b.top}}
function curve(a,b){var dx=Math.max(30,Math.abs(b.x-a.x)*.5);return "M"+a.x+","+a.y+" C"+(a.x+dx)+","+a.y+" "+(b.x-dx)+","+b.y+" "+b.x+","+b.y}
function mkLine(color){var g=document.createElementNS(NS,"g"),p=document.createElementNS(NS,"path"),c1=document.createElementNS(NS,"circle"),c2=document.createElementNS(NS,"circle");p.setAttribute("class","ln");p.setAttribute("stroke",color);[c1,c2].forEach(function(c){c.setAttribute("r",7);c.setAttribute("fill",color)});g.appendChild(p);g.appendChild(c1);g.appendChild(c2);svg.appendChild(g);g._p=p;g._c1=c1;g._c2=c2;return g}
function setLine(g,a,b){g._p.setAttribute("d",curve(a,b));g._c1.setAttribute("cx",a.x);g._c1.setAttribute("cy",a.y);g._c2.setAttribute("cx",b.x);g._c2.setAttribute("cy",b.y)}
function redraw(){conn.forEach(function(c){setLine(c.g,pt(c.chip,"r"),pt(c.card,"l"))})}
window.addEventListener("resize",redraw);
function evalHtml(){var n=D.length,p=Math.round(score/n*100),st=p>=90?5:p>=75?4:p>=55?3:p>=35?2:1,s="";for(var j=0;j<5;j++)s+=j<st?"⭐":"☆";var g=p>=90?"🏆 ممتاز — Excellent!":p>=75?"👏 جيد جداً — Very good!":p>=55?"🙂 جيد — Good!":"💪 حاول مرة أخرى — Try again!";var li=D.map(function(x,i){return '<div style="text-align:right;font-size:15px;font-weight:600">'+(i+1)+'. '+x.w+' '+(R[i]?'✅ من المحاولة الأولى':'❌ احتاجت إلى إعادة')+'</div>'}).join("");return '<div style="font-size:24px">📊 التقييم النهائي</div><div style="font-size:30px;margin:6px 0">'+s+'</div><div>'+g+'</div><div>الدرجة: '+score+' / '+n+' ('+p+'%)</div><div style="margin:8px 0">'+li+'</div><div style="font-size:16px">الأستاذة: Dhuha Karim 🌷</div>'}
var chipEls=[],cardEls=[];
function build(){
sel=null;score=0;answered=0;R=[];FIRST=[];conn=[];chipEls=[];cardEls=[];svg.innerHTML="";
document.getElementById("res").innerHTML="📊 التقييم النهائي سيظهر هنا بعد وصل جميع الجمل";
var W=document.getElementById("words"),S=document.getElementById("sents");W.innerHTML="";S.innerHTML="";
D.forEach(function(x,i){
var d=document.createElement("div");d.className="card";d.dataset.i=i;
d.innerHTML='<div class="en"><span class="num">'+(i+1)+'.</span>'+x.d+'</div><div class="pill" id="p'+i+'"></div><div class="wn" id="w'+i+'"></div><div class="fb" id="f'+i+'"></div>';
d.onclick=function(){if(sel!==null)connect(sel,i)};
S.appendChild(d);cardEls[i]=d});
D.map(function(x,i){return i}).sort(function(){return Math.random()-.5}).forEach(function(k){
var c=document.createElement("div");c.className="chip";c.textContent=D[k].w;c.style.borderColor=COL[k];c.dataset.k=k;
c.addEventListener("pointerdown",function(e){dragStart(e,k,c)});
W.appendChild(c);chipEls[k]=c});
setTimeout(redraw,50)}
function dragStart(e,k,c){
if(c.classList.contains("used"))return;e.preventDefault();
var g=mkLine(COL[k]),moved=false,a=pt(c,"r"),sx=e.clientX,sy=e.clientY;
try{c.setPointerCapture(e.pointerId)}catch(x){}
function mv(ev){var b=board.getBoundingClientRect();if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>8)moved=true;if(moved)setLine(g,a,{x:ev.clientX-b.left,y:ev.clientY-b.top})}
function up(ev){c.removeEventListener("pointermove",mv);c.removeEventListener("pointerup",up);c.removeEventListener("pointercancel",up);svg.removeChild(g);
if(moved){var t=document.elementFromPoint(ev.clientX,ev.clientY),cd=t&&t.closest?t.closest(".card"):null;if(cd)connect(k,+cd.dataset.i);else{if(sel!==null)chipEls[sel].classList.remove("sel");sel=null}}
else{if(sel!==null)chipEls[sel].classList.remove("sel");if(sel===k){sel=null}else{sel=k;c.classList.add("sel")}}}
c.addEventListener("pointermove",mv);c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up)}
function connect(k,i){
var card=cardEls[i],chip=chipEls[k];if(card.classList.contains("done")||chip.classList.contains("used"))return;
chip.classList.remove("sel");sel=null;
var x=D[i],ok=D[k].w===x.w,a=pt(chip,"r"),b=pt(card,"l");
if(ok){
chip.classList.add("used");card.classList.add("ok","done");card.style.borderColor=COL[k];
document.getElementById("p"+i).textContent="✔ "+D[k].w;document.getElementById("w"+i).style.display="none";
var g=mkLine(COL[k]);setLine(g,a,b);conn.push({g:g,chip:chip,card:card});
if(FIRST[i]!==false){score++;R[i]=true}else R[i]=false;
document.getElementById("f"+i).innerHTML='<div class="big">🎉 احسنت! Well done ✅</div><div><b>الترجمة:</b> '+x.t+' — '+x.a+'</div><div><b>سبب الحل:</b> '+x.r+'</div><div><button class="spk" onclick="say(full('+i+'));event.stopPropagation()">🔊</button> اضغط لسماع الجملة كاملة.</div>';
confetti();say(full(i));answered++;
setTimeout(redraw,30);
if(answered===D.length){var r=document.getElementById("res");r.innerHTML=evalHtml()+'<br><button class="re" onclick="build();window.scrollTo(0,0)">🔄 إعادة اللعبة</button>';setTimeout(function(){r.scrollIntoView({behavior:"smooth"})},700);if(score>=Math.ceil(D.length*.7))confetti()}
}else{
FIRST[i]=false;alarm();
var g2=mkLine("#ff0000");g2.classList.add("shake");setLine(g2,a,b);
card.classList.add("flash");
var w=document.getElementById("w"+i);w.style.display="block";
w.innerHTML='<b>❌ خطأ:</b> كلمة <b>'+D[k].w+'</b> ومعناها «'+D[k].t+'» لا تناسب هذه الجملة — فكّري وحاولي مرة أخرى.';
setTimeout(function(){if(g2.parentNode)svg.removeChild(g2);card.classList.remove("flash");redraw()},1500);
setTimeout(redraw,30)}}
build();
</script>
</body>
</html>
