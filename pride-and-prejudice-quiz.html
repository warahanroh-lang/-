<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pride and Prejudice – Quiz | الأستاذة Dhuha Karim</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#e9eef7;font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;color:#1b2a4a;overflow-x:hidden;transition:background .4s}
body.ok{background:#dff3e4}body.no{background:#fbe1e1}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 40px}
header{text-align:center;padding:10px 0 14px}
h1{margin:0;font-size:1.7rem;color:#7a2b55;direction:ltr}
.t{font-size:.95rem;color:#44537a;margin-top:2px}
.bar{height:10px;background:#cfd8ea;border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:#7a2b55;transition:width .4s}
.cnt{font-size:.9rem;color:#44537a;text-align:center}
.card{background:#fff;border-radius:18px;padding:18px;margin-top:12px;box-shadow:0 2px 10px #1b2a4a1f}
.q{direction:ltr;text-align:left;font-size:1.35rem;font-weight:700;line-height:1.4;margin:0 0 14px;font-family:Georgia,serif}
.opt{display:flex;gap:10px;align-items:center;direction:ltr;text-align:left;width:100%;margin:9px 0;padding:13px 14px;font:inherit;font-size:1.08rem;font-family:Georgia,serif;background:#f4f6fb;border:2px solid #c9d3e8;border-radius:13px;cursor:pointer;color:inherit}
.opt:hover:not(:disabled){border-color:#7a2b55}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:#1b2a4a;color:#fff;display:grid;place-items:center;font-family:Cairo,sans-serif}
.opt:disabled{cursor:default}
.opt.good{background:#cdeed6;border-color:#1f8a3f}.opt.good b{background:#1f8a3f}
.opt.bad{background:#f8cfcf;border-color:#c62828}.opt.bad b{background:#c62828}
.fb{display:none;margin-top:14px;padding:16px;border-radius:16px;border:3px solid}
.fb.show{display:block}
.fb.g{background:#e6f7ea;border-color:#1f8a3f}.fb.r{background:#fdeaea;border-color:#c62828}
.fb h2{margin:0 0 8px;font-size:1.5rem;display:flex;align-items:center;gap:10px}
.fb.g h2{color:#17702f}.fb.r h2{color:#b01f1f}
.face{font-size:2.6rem;line-height:1}
.fb p{margin:6px 0;line-height:1.7}
.en{direction:ltr;text-align:left;font-family:Georgia,serif;color:#33415f}
.lab{font-weight:900}
.snd{border:0;background:#1b2a4a;color:#fff;border-radius:30px;padding:8px 16px;font:inherit;cursor:pointer;margin:6px 0;font-size:1rem}
.next{display:none;width:100%;margin-top:14px;padding:13px;border:0;border-radius:14px;background:#7a2b55;color:#fff;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer}
.next.show{display:block}
.shake{animation:sh .5s}
@keyframes sh{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.pop{animation:pp .5s}
@keyframes pp{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.bl{position:fixed;bottom:-90px;font-size:2.8rem;z-index:9;pointer-events:none;animation:up 3.2s ease-in forwards}
@keyframes up{to{transform:translateY(-120vh) rotate(18deg)}}
.end{text-align:center}
.stars{font-size:2.6rem;letter-spacing:4px;margin:6px 0}
.big{font-size:2.4rem;font-weight:900;color:#7a2b55}
.foot{text-align:center;margin-top:22px;color:#44537a;font-size:.95rem}
.foot b{color:#7a2b55}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Pride and Prejudice</h1>
<div class="t">اقرأ واختر الإجابة الصحيحة · Read and Choose the Correct Answers</div>
<div class="t">الأستاذة: <b>Dhuha Karim</b></div>
</header>
<div class="bar"><i id="pb"></i></div>
<div class="cnt" id="cnt"></div>
<div id="app"></div>
<div class="foot">تصميم الأستاذة <b>Dhuha Karim</b></div>
</div>
<script>
var Q=[
{q:"Why doesn’t Mr Darcy want to dance?",qa:"لماذا لا يريد السيد دارسي أن يرقص؟",c:0,
o:[["He does not like the women in the room.","لا تعجبه النساء الموجودات في القاعة."],["He knows his partner too well.","إنه يعرف شريكته جيدًا جدًا."],["He is engaged to Mr Bingley’s sister.","إنه مخطوب لأخت السيد بينغلي."]],
why:["قال دارسي إنه لا توجد في القاعة امرأة أخرى يرغب في الرقص معها، لذلك لا يريد أن يرقص.","هو في الحقيقة يكره الرقص ما لم يكن يعرف شريكته جيدًا، أي أنه لا يعرف النساء هناك، فهذه الإجابة عكس ما قاله.","قال دارسي إن أختَي بينغلي مشغولتان بالرقص، ولم يقل إنه مخطوب لإحداهما."],
ok:"Darcy says there is no other woman in the room he would like to dance with.",oka:"قال دارسي إنه لا توجد امرأة أخرى في القاعة يرغب في الرقص معها."},
{q:"Who does Mr Darcy think is the only beautiful girl in the room?",qa:"من الفتاة التي يعتقد السيد دارسي أنها الفتاة الجميلة الوحيدة في القاعة؟",c:2,
o:[["Elizabeth","إليزابيث"],["Lydia","ليديا"],["Jane","جين"]],
why:["دارسي قال عن إليزابيث إنها مقبولة لكنها ليست جميلة بما يكفي له.","ليديا لم تُذكر في هذا الحوار أصلًا.","قال دارسي لبينغلي: أنت ترقص مع الفتاة الجميلة الوحيدة في القاعة، وكان ينظر إلى كبرى الآنسات بينيت، أي جين."],
ok:"Darcy tells Bingley he is dancing with the only beautiful girl, the eldest Miss Bennet, Jane.",oka:"قال دارسي لبينغلي إنه يرقص مع الفتاة الجميلة الوحيدة، كبرى الآنسات بينيت، وهي جين."},
{q:"How does Elizabeth react to Mr Darcy’s comment?",qa:"كيف كان رد فعل إليزابيث على تعليق السيد دارسي؟",c:1,
o:[["She felt ridiculous.","شعرت بأنها مثيرة للسخرية."],["She found it funny.","وجدت الأمر مضحكًا."],["She found it very friendly.","وجدت تعليقه ودّيًا جدًا."]],
why:["إليزابيث لم تشعر بالسخرية من نفسها، بل رأت الموقف نفسه مضحكًا.","رواية إليزابيث للقصة بين صديقاتها بحماس تدل على أنها وجدت الأمر مضحكًا.","تعليق دارسي كان باردًا ومهينًا، وإليزابيث لم تكن تحمل له مشاعر ودّية."],
ok:"Elizabeth told the story with great spirit to her friends, because she found ridiculous things funny.",oka:"روت إليزابيث القصة بحماس لصديقاتها لأنها تجد الأمور السخيفة مضحكة."},
{q:"What did Mrs Bennet think of Mr Bingley?",qa:"ما رأي السيدة بينيت في السيد بينغلي؟",c:1,
o:[["She was curious.","كانت فضولية."],["She was delighted.","كانت مسرورة جدًا."],["She was disappointed.","كانت خائبة الأمل."]],
why:["الفضول كان من صفات السيد بينيت الذي سهر ليعرف ما حدث، وليس رأي السيدة بينيت في بينغلي.","قالت السيدة بينيت إنها مسرورة به جدًا وإنه وسيم.","السيدة بينيت لم تكن خائبة الأمل، بل أثنى عليه وعلى أختيه كثيرًا."],
ok:"Mrs Bennet said she was quite delighted with him and that he was very handsome.",oka:"قالت السيدة بينيت إنها مسرورة به جدًا وإنه وسيم."},
{q:"What did Mrs Bennet think of Mr Darcy?",qa:"ما رأي السيدة بينيت في السيد دارسي؟",c:2,
o:[["She thought he wasn’t handsome.","اعتقدت أنه لم يكن وسيمًا."],["She thought he was great.","اعتقدت أنه شخص عظيم."],["She thought he was too proud.","اعتقدت أنه شديد الغرور."]],
why:["السيدة بينيت لم تتحدث عن شكله، بل عن تصرفه الفظ، فقد كان دارسي هو من قال إن ليزي ليست جميلة بما يكفي.","هو من ظن نفسه عظيمًا، أما السيدة بينيت فوصفته بأنه رجل بغيض.","وصفته السيدة بينيت بأنه متكبر ومغرور ولا يُحتمل، وقالت إنها تكرهه."],
ok:"Mrs Bennet called him so proud and so conceited that no one could stand him.",oka:"وصفته السيدة بينيت بأنه متكبر ومغرور إلى درجة لا يُحتمل معها."}
];
var i=0,score=0,AC=null,app=document.getElementById("app");
function beep(f,d,t,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function buzz(){for(var k=0;k<4;k++)setTimeout(function(){beep(150,.18,"sawtooth",.35)},k*230);if(navigator.vibrate)navigator.vibrate([200,80,200,80,300])}
function chime(){[523,659,784,1047].forEach(function(f,k){setTimeout(function(){beep(f,.25,"triangle",.3)},k*130)})}
function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}
function balloons(){var e=["🎈","🎈","🎉","🎈"];for(var k=0;k<16;k++){var b=document.createElement("div");b.className="bl";b.textContent=e[k%4];b.style.left=(Math.random()*92)+"vw";b.style.animationDelay=(Math.random()*.9)+"s";document.body.appendChild(b);setTimeout(function(x){x.remove()},4500,b)}}
function show(){
 var q=Q[i];document.body.className="";
 document.getElementById("pb").style.width=(i/Q.length*100)+"%";
 document.getElementById("cnt").textContent="السؤال "+(i+1)+" من "+Q.length;
 var h='<div class="card" id="card"><p class="q">'+q.q+'</p>';
 q.o.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'"><b>'+"abc"[k]+'</b><span>'+o[0]+'</span></button>'});
 h+='<div class="fb" id="fb"></div><button class="next" id="nx">'+(i<Q.length-1?"السؤال التالي ◀":"عرض النتيجة ◀")+'</button></div>';
 app.innerHTML=h;
 [].forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){pick(+b.dataset.k)}});
 document.getElementById("nx").onclick=function(){i++;speechSynthesis&&speechSynthesis.cancel();i<Q.length?show():fin()};
}
function pick(k){
 var q=Q[i],good=k==q.c,bs=app.querySelectorAll(".opt"),sent=q.q+" "+q.o[q.c][0];
 bs.forEach(function(b,j){b.disabled=true;if(j==q.c)b.classList.add("good");else if(j==k)b.classList.add("bad")});
 var f=document.getElementById("fb"),h="";
 if(good){score++;document.body.className="ok";
  h='<h2><span class="face pop">🎈</span> أحسنت! <span class="en" style="font-size:1.1rem">Well done!</span></h2>'+
  '<p><span class="lab">السؤال:</span> '+q.qa+'</p><p><span class="lab">الإجابة الصحيحة:</span> '+q.o[q.c][1]+'</p><p><span class="lab">السبب:</span> '+q.oka+'</p><p class="en">'+q.ok+'</p>';
  f.className="fb g show";balloons();chime();
 }else{document.body.className="no";
  h='<h2><span class="face shake">😠</span> إجابة خاطئة</h2>'+
  '<p><span class="lab">السؤال:</span> '+q.qa+'</p><p><span class="lab">اخترتَ:</span> '+q.o[k][1]+'</p><p><span class="lab">لماذا هي خاطئة؟</span> '+q.why[k]+'</p>'+
  '<p><span class="lab">الإجابة الصحيحة:</span> <span class="en">'+q.o[q.c][0]+'</span><br>'+q.o[q.c][1]+'</p><p><span class="lab">السبب:</span> '+q.oka+'</p><p class="en">'+q.ok+'</p>';
  f.className="fb r show";document.getElementById("card").classList.add("shake");buzz();
 }
 h+='<button class="snd" id="sd">🔊 استمع للجملة</button>';
 f.innerHTML=h;document.getElementById("sd").onclick=function(){say(sent)};
 document.getElementById("nx").classList.add("show");
 setTimeout(function(){say(sent)},good?500:1100);
 f.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function fin(){
 document.body.className="";document.getElementById("pb").style.width="100%";document.getElementById("cnt").textContent="انتهت اللعبة";
 var s=score,st="⭐".repeat(s)+"☆".repeat(5-s),m=["حاول مرة أخرى، ستتحسن!","تحتاج إلى مزيد من المراجعة.","جيد، واصل التقدم.","جيد جدًا!","ممتاز جدًا!","رائع! علامة كاملة!"][s];
 if(s>=4){balloons();chime()}
 app.innerHTML='<div class="card end"><div>التقييم النهائي</div><div class="stars">'+st+'</div><div class="big">'+s+' / '+Q.length+'</div><p style="font-size:1.2rem;font-weight:700">'+m+'</p><button class="next show" id="rs">إعادة اللعبة 🔄</button><p class="foot">الأستاذة: <b>Dhuha Karim</b></p></div>';
 document.getElementById("rs").onclick=function(){i=0;score=0;show()};
}
show();
</script>
</body>
</html>
