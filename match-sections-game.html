<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match the Sections to Their Definitions</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#000;background:linear-gradient(135deg,#ffd6e8,#d6ecff 40%,#d9ffe6 70%,#fff3c4);background-attachment:fixed;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:14px}
header{text-align:center;background:rgba(255,255,255,.85);border-radius:20px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
h1{margin:0;font-size:22px;color:#000}
h2{margin:4px 0;font-size:16px;color:#000;font-weight:600}
.by{display:inline-block;margin-top:6px;background:#ffe36e;border-radius:99px;padding:4px 16px;font-weight:700;color:#000}
.bank{position:sticky;top:0;z-index:5;margin:12px 0;background:rgba(255,255,255,.95);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.chip{background:#fff;border:2px solid #7c5cff;color:#000;border-radius:12px;padding:8px 12px;font-size:16px;font-weight:700;cursor:grab;user-select:none;touch-action:manipulation}
.chip.sel{background:#ffe36e;transform:scale(1.07)}
.chip.used{opacity:.25;pointer-events:none}
.card{background:#fff;color:#000;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.12);border:3px solid transparent;position:relative;overflow:hidden}
.card.ok{background:#d8ffe0;border-color:#22b04b}
.card.bad{background:#ffdede;border-color:#e03131}
.en{direction:ltr;text-align:left;font-size:18px;line-height:2.2;color:#000}
.ar{font-size:15px;margin-top:4px;color:#000}
.blank{display:inline-block;min-width:130px;min-height:36px;vertical-align:middle;border:3px dashed #7c5cff;border-radius:10px;background:#f3efff;text-align:center;line-height:30px;font-weight:700;color:#000;padding:0 6px}
.blank.over{background:#ffe36e}
.ok .blank{border:3px solid #22b04b;background:#b6f5c3}
.bad .blank{border:3px solid #e03131;background:#ffb9b9}
.fb{display:none;margin-top:8px;font-size:15px;line-height:1.7;color:#000}
.done .fb{display:block}
.big{font-size:22px;font-weight:800;color:#000}
.spk{border:0;background:#4c6fff;color:#fff;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;vertical-align:middle;margin-inline-start:6px}
.num{position:absolute;top:8px;inset-inline-end:12px;font-weight:800;color:#000;opacity:.5}
#res{display:block;text-align:center;background:#fff;border-radius:18px;padding:16px;font-size:20px;font-weight:800;color:#000}
button.re{margin-top:8px;border:0;background:#22b04b;color:#fff;font-size:16px;font-weight:700;padding:10px 22px;border-radius:12px;cursor:pointer}
.conf{position:fixed;top:-30px;font-size:24px;z-index:99;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🎯 Match the Sections to Their Definitions</h1>
<h2>لعبة: صل كل تعريف بالقسم المناسب</h2>
<div class="by">✏️ إعداد الأستاذة: ضحى (Dhuha)</div>
</header>
<p style="text-align:center;font-weight:600;margin:10px 0 0">اضغط على الكلمة ثم اضغط على الفراغ، أو اسحبها إلى الفراغ 👇</p><p style="text-align:center;margin:6px 0"><button class="re" onclick="say('Hello! Welcome to the game.')">🔊 تجربة الصوت</button></p>
<div class="bank" id="bank"></div>
<div id="list"></div>
<div id="res"></div>
</div>
<script>
var D=[
{w:"Cartoons",v:"are",d:"funny stories with small pictures",a:"قصص مضحكة مع صور صغيرة",r:"الكاريكاتير (Cartoons) هو قصص مضحكة تُروى بصور صغيرة متتابعة."},
{w:"Jokes",v:"are",d:"short, funny stories",a:"قصص قصيرة مضحكة",r:"النكت (Jokes) هي قصص قصيرة ومضحكة تجعلنا نضحك."},
{w:"Poetry",v:"is",d:"writing with words that rhyme",a:"كتابة بألفاظ تتشابه في القافية",r:"الشعر (Poetry) هو كتابة بكلمات متقاربة في القافية مثل red وbed."},
{w:"Interviews",v:"are",d:"asking people questions about themselves",a:"طرح أسئلة على الناس عن أنفسهم",r:"المقابلات (Interviews) فيها نسأل الشخص أسئلة عن نفسه وحياته."},
{w:"Town events",v:"are",d:"things happening in the town",a:"ما يحدث في المدينة",r:"فعاليات المدينة (Town events) هي الأنشطة والأحداث التي تقع في المدينة."},
{w:"Sports reports",v:"are",d:"descriptions of events, for example, football matches",a:"وصف للأحداث، مثل مباريات كرة القدم",r:"التقارير الرياضية (Sports reports) تصف الأحداث الرياضية مثل مباراة كرة القدم."},
{w:"School news",v:"is",d:"reports about school events",a:"تقارير عن فعاليات المدرسة",r:"أخبار المدرسة (School news) هي تقارير عن الأحداث التي تحدث في المدرسة."}
];
var AR={"Cartoons":"كاريكاتير","Jokes":"نكت","Poetry":"شعر","Interviews":"مقابلات","Town events":"فعاليات المدينة","Sports reports":"تقارير رياضية","School news":"أخبار المدرسة"};
var R=[],sel=null,score=0,answered=0,voice=null;
function pick(){var v=speechSynthesis.getVoices();voice=v.find(function(x){return x.lang.replace("_","-")==="en-GB"})||v.find(function(x){return /en-GB|British/i.test(x.lang+x.name)})||v.find(function(x){return /^en/i.test(x.lang)})||null}
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){var d=false;function fb(){if(d)return;d=true;tts(t)}try{if(window.__a)window.__a.pause();if(window.speechSynthesis)speechSynthesis.cancel();var a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-GB&q="+encodeURIComponent(t));window.__a=a;a.playbackRate=.9;a.onerror=fb;var p=a.play();if(p&&p.catch)p.catch(fb)}catch(e){fb()}}
function tts(t){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){alert('المتصفح لا يدعم النطق، افتحي الرابط في Chrome أو Safari');return}pick();speechSynthesis.cancel();setTimeout(function(){var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.8;u.pitch=1;speechSynthesis.speak(u);speechSynthesis.resume()},120)}
function evalHtml(){var p=Math.round(score/D.length*100),st=score>=6?5:score>=5?4:score>=4?3:score>=2?2:1,s="";for(var j=0;j<5;j++)s+=j<st?"⭐":"☆";var g=score>=6?"🏆 ممتاز — Excellent!":score>=4?"👏 جيد جداً — Very good!":score>=2?"🙂 مقبول — Keep trying!":"💪 تحتاج إلى مراجعة — Try again!";var li=D.map(function(x,i){return '<div style="text-align:right;font-size:15px;font-weight:600">'+(i+1)+'. '+x.w+' '+(R[i]?'✅ صحيحة':'❌ خاطئة')+'</div>'}).join("");return '<div style="font-size:24px">📊 التقييم النهائي</div><div style="font-size:30px;margin:6px 0">'+s+'</div><div>'+g+'</div><div>الدرجة: '+score+' / '+D.length+' ('+p+'%)</div><div style="margin:8px 0">'+li+'</div>'}
function full(i){return D[i].w+" "+D[i].v+" "+D[i].d+"."}
function confetti(){var e=["🎉","🎊","✨","⭐","🌸","🎈"];for(var i=0;i<28;i++){var s=document.createElement("span");s.className="conf";s.textContent=e[i%e.length];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()}.bind(null,s),3200)}}
function build(){
sel=null;score=0;answered=0;R=[];document.getElementById("res").innerHTML='📊 التقييم النهائي سيظهر هنا بعد حل جميع الجمل';
var b=document.getElementById("bank"),l=document.getElementById("list");b.innerHTML="";l.innerHTML="";
D.map(function(x,i){return i}).sort(function(){return Math.random()-.5}).forEach(function(i){
var c=document.createElement("div");c.className="chip";c.textContent=D[i].w;c.draggable=true;c.dataset.i=i;
c.onclick=function(){if(sel)sel.classList.remove("sel");sel=c;c.classList.add("sel")};
c.ondragstart=function(e){e.dataTransfer.setData("text",i);if(sel)sel.classList.remove("sel");sel=c};
b.appendChild(c)});
D.forEach(function(x,i){
var d=document.createElement("div");d.className="card";d.id="c"+i;
d.innerHTML='<span class="num">'+(i+1)+'</span><div class="en"><span class="blank" id="b'+i+'">&nbsp;</span> '+x.v+" "+x.d+'. <button class="spk" id="s'+i+'" aria-label="listen">🔊</button></div><div class="ar">'+x.a+'</div><div class="fb" id="f'+i+'"></div>';
l.appendChild(d);
var bl=d.querySelector(".blank");
bl.onclick=function(){if(sel)place(i,+sel.dataset.i)};
bl.ondragover=function(e){e.preventDefault();bl.classList.add("over")};
bl.ondragleave=function(){bl.classList.remove("over")};
bl.ondrop=function(e){e.preventDefault();bl.classList.remove("over");var k=e.dataTransfer.getData("text");if(k!=="")place(i,+k)};
d.querySelector(".spk").onclick=function(){say(d.classList.contains("done")?full(i):x.d)}
})}
function place(i,k){
var c=document.getElementById("c"+i);if(c.classList.contains("done"))return;
var chip=document.querySelector('.chip[data-i="'+k+'"]');if(!chip||chip.classList.contains("used"))return;
chip.classList.remove("sel");chip.classList.add("used");sel=null;
var bl=document.getElementById("b"+i),f=document.getElementById("f"+i),x=D[i];
bl.textContent=D[k].w;c.classList.add("done");answered++;R[i]=(k===i);
if(k===i){score++;c.classList.add("ok");
f.innerHTML='<div class="big">🎉 احسنت! Well done ✅</div><div>السبب: '+x.r+'</div><div>🔊 اضغط على الصوت لسماع الجملة كاملة.</div>';
confetti()}
else{c.classList.add("bad");
f.innerHTML='<div class="big">😞 إجابة خاطئة ❌</div><div>اخترتِ: <b>'+D[k].w+'</b> ومعناها «'+AR[D[k].w]+'» وهي لا تناسب هذا التعريف.</div><div>✔️ الحل الصحيح: <b>'+x.w+'</b> ('+AR[x.w]+')</div><div>السبب: '+x.r+'</div>';
bl.innerHTML=D[k].w+'<br><small style="color:#000">✔ '+x.w+'</small>';bl.style.lineHeight="22px"}
say(full(i));
if(answered===D.length){var r=document.getElementById("res");r.style.display="block";
r.innerHTML=evalHtml()+'<br><button class="re" onclick="build();window.scrollTo(0,0)">🔄 إعادة اللعبة</button>';
r.scrollIntoView({behavior:"smooth"});if(score>=6)confetti()}}
build();
</script>
</body>
</html>
