<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pride and Prejudice – True or False | الأستاذة Dhuha Karim</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#e9eef7;font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;color:#1b2a4a;overflow-x:hidden;transition:background .4s}
body.ok{background:#dff3e4}body.no{background:#fbe1e1}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 40px}
header{text-align:center;padding:10px 0 14px}
h1{margin:0;font-size:1.7rem;color:#7a2b55;direction:ltr}
.t{font-size:.95rem;color:#44537a;margin-top:2px}
.bar{height:10px;background:#cfd8ea;border-radius:9px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:#7a2b55;transition:width .4s}
.cnt{font-size:.9rem;color:#44537a;text-align:center}
.card{background:#fff;border-radius:18px;padding:18px;margin-top:12px;box-shadow:0 2px 10px #1b2a4a1f}
.q{direction:ltr;text-align:left;font-size:1.35rem;font-weight:700;line-height:1.4;margin:0 0 14px;font-family:Georgia,serif}
.x{display:flex;gap:10px;align-items:center;direction:ltr;text-align:left;width:100%;margin:9px 0;padding:13px 14px;font:inherit;font-size:1.08rem;font-family:Georgia,serif;background:#f4f6fb;border:2px solid #c9d3e8;border-radius:13px;cursor:pointer;color:inherit}
.opt:hover:not(:disabled){border-color:#7a2b55}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:#1b2a4a;color:#fff;display:grid;place-items:center;font-family:Cairo,sans-serif}
.opt:disabled{cursor:default}
.opt.good{background:#cdeed6;border-color:#1f8a3f}.opt.good b{background:#1f8a3f}
.opt.bad{background:#f8cfcf;border-color:#c62828}.opt.bad b{background:#c62828}
.fb{display:none;margin-top:14px;padding:16px;border-radius:16px;border:3px solid}
.fb.show{display:block}
.fb.g{background:#e6f7ea;border-color:#1f8a3f}.fb.r{background:#fdeaea;border-color:#c62828}
.fb h2{margin:0 0 8px;font-size:1.5rem;display:flex;align-items:center;gap:10px}
.fb.g h2{color:#17702f}.fb.r h2{color:#b01f1f}
.face{font-size:2.6rem;line-height:1}
.fb p{margin:6px 0;line-height:1.7}
.en{direction:ltr;text-align:left;font-family:Georgia,serif;color:#33415f}
.lab{font-weight:900}
.tf{display:flex;gap:12px;direction:ltr}.tf button{flex:1;padding:18px 6px;font:inherit;font-weight:900;font-size:1.5rem;border-radius:16px;border:3px solid;cursor:pointer;font-family:Georgia,serif}.tf .t{background:#e6f7ea;border-color:#1f8a3f;color:#17702f}.tf .f{background:#fdeaea;border-color:#c62828;color:#b01f1f}.tf button:disabled{opacity:.55;cursor:default}.tf button.pk{opacity:1;outline:4px solid #1b2a4a}.st{position:fixed;top:-60px;font-size:2rem;z-index:9;pointer-events:none;animation:dn 3s linear forwards}@keyframes dn{to{transform:translateY(120vh) rotate(360deg)}}.snd{border:0;background:#1b2a4a;color:#fff;border-radius:30px;padding:8px 16px;font:inherit;cursor:pointer;margin:6px 0;font-size:1rem}
.next{display:none;width:100%;margin-top:14px;padding:13px;border:0;border-radius:14px;background:#7a2b55;color:#fff;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer}
.next.show{display:block}
.shake{animation:sh .5s}
@keyframes sh{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.pop{animation:pp .5s}
@keyframes pp{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.bl{position:fixed;bottom:-90px;font-size:2.8rem;z-index:9;pointer-events:none;animation:up 3.2s ease-in forwards}
@keyframes up{to{transform:translateY(-120vh) rotate(18deg)}}
.end{text-align:center}
.stars{font-size:2.6rem;letter-spacing:4px;margin:6px 0}
.big{font-size:2.4rem;font-weight:900;color:#7a2b55}
.foot{text-align:center;margin-top:22px;color:#44537a;font-size:.95rem}
.foot b{color:#7a2b55}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Pride and Prejudice</h1>
<div class="t">Exercise B · True / False</div>
<div class="t">الأستاذة: <b>Dhuha Karim</b></div>
</header>
<div class="bar"><i id="pb"></i></div>
<div class="cnt" id="cnt"></div>
<div id="app"></div>
<div class="foot">تصميم الأستاذة <b>Dhuha Karim</b></div>
</div>
<script>
var Q=[
["Both Bingley sisters have husbands.","كلتا أختي بينغلي متزوجتان.",0,"Only one of the Bingley sisters has a husband.","فقط إحدى أختي بينغلي لديها زوج.","Mr Bingley brought his two sisters and only one brother-in-law.","أحضر السيد بينغلي أختيه ومعهما زوج واحد فقط."],
["Mr Bingley thinks Mr Darcy is too difficult to please.","يعتقد السيد بينغلي أن السيد دارسي يصعب إرضاؤه كثيرًا.",1,"Mr Bingley thinks Mr Darcy is too difficult to please.","يعتقد السيد بينغلي أن السيد دارسي يصعب إرضاؤه كثيرًا.","Bingley says he would not be as picky as Darcy for a kingdom.","قال بينغلي إنه لن يكون متشددًا مثل دارسي ولو مقابل مملكة."],
["Mr Bingley thinks Elizabeth is pretty.","يعتقد السيد بينغلي أن إليزابيث جميلة.",1,"Mr Bingley thinks Elizabeth is pretty.","يعتقد السيد بينغلي أن إليزابيث جميلة.","He says that Jane’s sister sitting behind Darcy is very pretty.","قال إن شقيقة جين التي تجلس خلف دارسي جميلة جدًا."],
["Mr Darcy thinks Elizabeth is the only beautiful girl in the room.","يعتقد السيد دارسي أن إليزابيث هي الفتاة الجميلة الوحيدة في القاعة.",0,"Mr Darcy thinks Jane is the only beautiful girl in the room.","يعتقد السيد دارسي أن جين هي الفتاة الجميلة الوحيدة في القاعة.","Darcy looks at the eldest Miss Bennet, Jane, and says she is the only beautiful girl. He says Elizabeth is only tolerable.","نظر دارسي إلى كبرى الآنسات بينيت، جين، وقال إنها الجميلة الوحيدة، أما إليزابيث فقال إنها مقبولة فقط."],
["Elizabeth found Mr Darcy lively and playful.","وجدت إليزابيث السيد دارسي مرحًا ومحبًا للمزاح.",0,"Elizabeth did not feel friendly towards Mr Darcy. She found him proud and rude.","لم تكن إليزابيث تحمل مشاعر ودية تجاه السيد دارسي؛ فقد وجدته متكبرًا ووقحًا.","It was Elizabeth who was lively and playful, not Mr Darcy.","إليزابيث هي التي كانت مرحة ومحبة للمزاح، وليس السيد دارسي."],
["Mr Bingley danced with all the girls twice.","رقص السيد بينغلي مع جميع الفتيات مرتين.",0,"Mr Bingley danced with Jane twice.","رقص السيد بينغلي مع جين مرتين.","Mrs Bennet says he danced with Jane twice, not with all the girls.","تقول السيدة بينيت إنه رقص مع جين مرتين، وليس مع جميع الفتيات."],
["Mrs Bennet thought Mr Darcy was so great.","اعتقدت السيدة بينيت أن السيد دارسي عظيم جدًا.",0,"Mrs Bennet thought Mr Darcy was too proud and conceited.","اعتقدت السيدة بينيت أن السيد دارسي متكبر ومغرور للغاية.","She says he is so proud and conceited that no one could stand him. It was Darcy who thought himself very great.","قالت إنه متكبر ومغرور إلى درجة لا تُحتمل؛ فهو من كان يظن نفسه عظيمًا."]
];
var i=0,score=0,AC=null,V=null,app=document.getElementById("app");
function beep(f,d,t,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function buzz(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type="sawtooth";o2.type="square";g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.05);g.gain.setValueAtTime(.5,t+2.1);g.gain.exponentialRampToValueAtTime(.0001,t+2.4);for(var k=0;k<4;k++){var s=t+k*.6;[o,o2].forEach(function(x,n){var m=n?1.5:1;x.frequency.setValueAtTime(650*m,s);x.frequency.exponentialRampToValueAtTime(1300*m,s+.3);x.frequency.exponentialRampToValueAtTime(650*m,s+.58)})}o.connect(g);o2.connect(g);g.connect(AC.destination);o.start(t);o2.start(t);o.stop(t+2.4);o2.stop(t+2.4)}catch(e){}if(navigator.vibrate)navigator.vibrate([300,100,300,100,400,100,400])}
function chime(){[523,659,784,1047].forEach(function(f,k){setTimeout(function(){beep(f,.25,"triangle",.3)},k*130)})}
function pickV(){var l=speechSynthesis.getVoices();V=l.filter(function(v){return v.lang.replace("_","-")=="en-GB"})[0]||l.filter(function(v){return /^en/.test(v.lang)})[0]||null}
if(window.speechSynthesis){pickV();speechSynthesis.onvoiceschanged=pickV}
function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(V)u.voice=V;u.rate=.8;speechSynthesis.speak(u)}
function fly(list,cls,n){for(var k=0;k<n;k++){var b=document.createElement("div");b.className=cls;b.textContent=list[k%list.length];b.style.left=(Math.random()*92)+"vw";b.style.animationDelay=(Math.random()*.9)+"s";document.body.appendChild(b);setTimeout(function(x){x.remove()},4500,b)}}
function celebrate(){fly(["🎈","🎉","🎈"],"bl",14);fly(["⭐","🌟","💫","✨","🌈"],"st",18)}
function show(){
 var q=Q[i];document.body.className="";
 document.getElementById("pb").style.width=(i/Q.length*100)+"%";
 document.getElementById("cnt").textContent="Question "+(i+1)+" / "+Q.length;
 app.innerHTML='<div class="card" id="card"><p class="q">'+q[0]+'</p><div class="tf"><button class="t" data-a="1">TRUE</button><button class="f" data-a="0">FALSE</button></div><div class="fb" id="fb"></div><button class="next" id="nx">'+(i<Q.length-1?"السؤال التالي ◀":"عرض النتيجة ◀")+'</button></div>';
 [].forEach.call(app.querySelectorAll(".tf button"),function(b){b.onclick=function(){pick(+b.dataset.a,b)}});
 document.getElementById("nx").onclick=function(){i++;window.speechSynthesis&&speechSynthesis.cancel();i<Q.length?show():fin()};
}
function pick(a,btn){
 var q=Q[i],good=a==q[2],ans=q[2]?"TRUE":"FALSE",sent=q[0]+" This is "+ans.toLowerCase()+". "+q[5];
 [].forEach.call(app.querySelectorAll(".tf button"),function(b){b.disabled=true});btn.classList.add("pk");
 var f=document.getElementById("fb"),h="";
 var body='<p><span class="lab">الجملة:</span> '+q[1]+'</p><p><span class="lab">الإجابة الصحيحة:</span> '+(q[2]?"صح (True)":"خطأ (False)")+'</p>'+(q[2]?'':'<p><span class="lab">الجملة الصحيحة:</span> '+q[4]+'</p><p class="en">'+q[3]+'</p>')+'<p><span class="lab">السبب:</span> '+q[6]+'</p><p class="en">'+q[5]+'</p>';
 if(good){score++;document.body.className="ok";
  h='<h2><span class="face pop">🎈</span> أحسنت! <span class="en" style="font-size:1.1rem">Well done!</span></h2>'+body;f.className="fb g show";celebrate();chime();
 }else{document.body.className="no";
  h='<h2><span class="face shake">😠</span> إجابة خاطئة</h2><p><span class="lab">لماذا خطأ؟</span> اخترتَ '+(a?"True":"False")+' لكن الإجابة الصحيحة هي '+ans+'.</p>'+body;f.className="fb r show";document.getElementById("card").classList.add("shake");buzz();
 }
 h+='<button class="snd" id="sd">🔊 استمع</button>';f.innerHTML=h;
 document.getElementById("sd").onclick=function(){say(sent)};
 document.getElementById("nx").classList.add("show");
 setTimeout(function(){say(sent)},good?500:2500);
 f.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function fin(){
 document.body.className="";document.getElementById("pb").style.width="100%";document.getElementById("cnt").textContent="انتهت اللعبة";
 var s=score,n=Math.round(s/Q.length*5),st="⭐".repeat(n)+"☆".repeat(5-n),m=s==7?"رائع! علامة كاملة!":s>=6?"ممتاز جدًا!":s>=5?"جيد جدًا!":s>=4?"جيد، واصل التقدم.":"تحتاج إلى مزيد من المراجعة، حاول مرة أخرى.";
 if(s>=5){celebrate();chime()}
 app.innerHTML='<div class="card end"><div>التقييم النهائي</div><div class="stars">'+st+'</div><div class="big">'+s+' / '+Q.length+'</div><p style="font-size:1.2rem;font-weight:700">'+m+'</p><button class="next show" id="rs">إعادة اللعبة 🔄</button><p class="foot">الأستاذة: <b>Dhuha Karim</b></p></div>';
 document.getElementById("rs").onclick=function(){i=0;score=0;show()};
}
show();
</script>
</body>
</html>
